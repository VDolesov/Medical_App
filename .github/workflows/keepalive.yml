name: keepalive

# Бесплатные инстансы Render засыпают без трафика — пингуем раз в 10 минут.
# Запускается только с default-ветки репозитория.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Java API (v3)
        # После первого деплоя проверьте адрес в Render Dashboard и при необходимости поправьте.
        run: curl -sSf --max-time 90 --retry 3 --retry-delay 10 https://reportmed-api-v3.onrender.com/ping
        continue-on-error: true
      - name: Ping Node API (v1, пока не выключен)
        run: curl -sSf --max-time 90 --retry 3 --retry-delay 10 https://reportmed-api.onrender.com/ping
        continue-on-error: true
