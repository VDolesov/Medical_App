spring:
  application:
    name: medical-app

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      # Дефолт Spring — 1MB, что меньше прикладного лимита загрузки XLSX (10MB).
      # Без этого файлы 1-10 МБ падали бы с невнятной ошибкой ещё до контроллера.
      max-file-size: 10MB
      max-request-size: 12MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  cache:
    type: caffeine
    cache-names: norms
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

server:
  # Railway (и многие PaaS) пробрасывают порт через переменную PORT.
  # Локально PORT не задан — падаем на SERVER_PORT, затем на 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  # За реверс-прокси (Railway/nginx) реальные схема и IP клиента приходят
  # в X-Forwarded-* заголовках — без этого rate-limit и редиректы видят прокси.
  forward-headers-strategy: framework

app:
  security:
    jwt:
      # Дефолта намеренно нет: публично известный fallback-секрет в репозитории
      # позволил бы подделать любой токен. Прод без JWT_SECRET падает на старте
      # (проверка в JwtUtil), dev-значение задано в application-dev.yml.
      secret: ${JWT_SECRET:}
      expiration-ms: ${JWT_EXPIRATION_MS:28800000}

  admin-secret: ${ADMIN_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
