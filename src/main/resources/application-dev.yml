spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medical?characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        connection:
          characterEncoding: UTF-8
          useUnicode: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-medical-app-jwt-secret-key-32-plus-chars}
      expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  admin-secret: ${ADMIN_SECRET:77777777777777777}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
  swagger:
    public-enabled: ${SWAGGER_PUBLIC_ENABLED:true}
