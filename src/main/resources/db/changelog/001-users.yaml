databaseChangeLog:
  - changeSet:
      id: 001-users
      author: medical-app
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: username, type: VARCHAR(100), constraints: { nullable: false, unique: true } }
              - column: { name: password_hash, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: email, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: first_name, type: VARCHAR(100) }
              - column: { name: last_name, type: VARCHAR(100) }
              - column: { name: role, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: patient_id, type: BIGINT, constraints: { nullable: true, unique: true } }
