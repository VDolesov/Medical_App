databaseChangeLog:
  - changeSet:
      id: 006-seed-clinical-knowledge
      author: medical-app
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              INSERT INTO clinical_sources (code, title, organization, year, url, description) VALUES
                ('KR-RF-THYROID-CANCER',
                 'Клинические рекомендации РФ: Рак щитовидной железы',
                 'Минздрав России',
                 2025,
                 'https://www.consultant.ru/document/cons_doc_LAW_496489/',
                 'Основной российский источник для диагностики, лечения, послеоперационного ведения, рецидивов и диспансерного наблюдения при раке щитовидной железы.'),
                ('KR-RF-MTC',
                 'Клинические рекомендации РФ: Медуллярный рак щитовидной железы',
                 'Минздрав России',
                 2025,
                 'https://www.consultant.ru/document/cons_doc_LAW_487866/',
                 'Российский источник для интерпретации кальцитонина, РЭА, обследования и наблюдения при медуллярном раке щитовидной железы.'),
                ('KR-RF-HYPOPARATHYROIDISM',
                 'Клинические рекомендации РФ: Гипопаратиреоз у взрослых',
                 'Минздрав России',
                 2021,
                 'https://legalacts.ru/doc/klinicheskie-rekomendatsii-gipoparatireoz-u-vzroslykh-utv-minzdravom-rossii/',
                 'Российский источник по диагностике, лечению и наблюдению при транзиторном и хроническом послеоперационном гипопаратиреозе.'),
                ('KR-RF-HYPOTHYROIDISM',
                 'Клинические рекомендации РФ: Гипотиреоз',
                 'Минздрав России',
                 2025,
                 'https://www.consultant.ru/document/cons_doc_LAW_486326/',
                 'Российский источник по лабораторной диагностике и заместительной терапии гипотиреоза.')
              ON CONFLICT (code) DO UPDATE SET
                title = EXCLUDED.title,
                organization = EXCLUDED.organization,
                year = EXCLUDED.year,
                url = EXCLUDED.url,
                description = EXCLUDED.description;

              INSERT INTO clinical_rules
                (code, title, category, severity, priority, is_active, condition_json, action_json, rationale, patient_message, source_id, source_section)
              VALUES
                (
                  'R-001',
                  'Признаки стандартного послеоперационного наблюдения при локализованном РЩЖ',
                  'FOLLOW_UP',
                  'INFO',
                  10,
                  TRUE,
                  '{"all":[{"feature":"tnm_t_post","op":"in","values":["T1","T2"]},{"feature":"tnm_n_post","op":"in","values":["N0","Nx"]},{"feature":"tnm_m_post","op":"eq","value":"M0"}]}'::jsonb,
                  '{"verdict":"STANDARD_FOLLOW_UP","tags":["follow_up","localized_thyroid_cancer"],"recommendations":["Плановое наблюдение у профильного специалиста по индивидуальному графику.","Контроль ТТГ и свободного Т4 по назначению врача.","УЗИ шеи и лабораторные маркеры наблюдения в сроки, определённые лечащим врачом."]}'::jsonb,
                  'По данным TNM после гистологической верификации нет признаков отдалённых метастазов и выраженного регионарного распространения. Для таких пациентов обычно рассматривается стандартное динамическое наблюдение после операции, с контролем лабораторных показателей и УЗИ шеи по клинической ситуации.',
                  'По имеющимся данным наблюдение может проходить в плановом режиме. Это не отменяет регулярные визиты и контроль анализов по графику лечащего врача.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-THYROID-CANCER'),
                  'Разделы 5 и 7.2'
                ),
                (
                  'R-002',
                  'Факторы для более частого послеоперационного наблюдения',
                  'FOLLOW_UP',
                  'WARNING',
                  20,
                  TRUE,
                  '{"any":[{"feature":"tnm_t_post","op":"eq","value":"T3"},{"all":[{"feature":"antibody_to_tg_post","op":"gt","value":115},{"feature":"antibody_to_tg_delta","op":"gt","value":30}]},{"feature":"bethesda","op":"eq","value":5}]}'::jsonb,
                  '{"verdict":"INTENSIFIED_FOLLOW_UP","tags":["follow_up","oncology_attention"],"recommendations":["Уточнить индивидуальный план наблюдения у эндокринолога или онколога.","Контроль УЗИ шеи и лабораторных маркеров наблюдения по сокращённому интервалу, если это подтверждено врачом.","Сопоставить лабораторные изменения с гистологией, TNM и клинической картиной."]}'::jsonb,
                  'T3 по послеоперационной гистологии, выраженная цитологическая настороженность или рост антител к тиреоглобулину являются основаниями для более внимательного динамического контроля. Правило не ставит диагноз рецидива, а выделяет пациента для приоритетной врачебной оценки.',
                  'По части показателей требуется более внимательное наблюдение. Это не означает рецидив, но врачу важно оценить динамику и при необходимости назначить более частый контроль.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-THYROID-CANCER'),
                  'Разделы 2.5, 5 и 7.2'
                ),
                (
                  'R-003',
                  'Признаки высокого онкологического внимания после операции',
                  'RECURRENCE_SUSPECT',
                  'CRITICAL',
                  30,
                  TRUE,
                  '{"any":[{"feature":"tnm_t_post","op":"in","values":["T4","T4a","T4b"]},{"feature":"tnm_m_post","op":"eq","value":"M1"},{"all":[{"feature":"cea_post","op":"gt","value":5},{"feature":"calcitonin_post","op":"gt","value":50}]}]}'::jsonb,
                  '{"verdict":"HIGH_ONCOLOGY_ATTENTION","tags":["oncology","follow_up"],"recommendations":["Приоритетная очная оценка профильным специалистом.","Сопоставить лабораторные маркеры с гистологическим типом опухоли и результатами визуализации.","Рассмотреть дообследование по клиническим рекомендациям: УЗИ шеи, КТ/МРТ или другие методы по показаниям."]}'::jsonb,
                  'T4, M1 или сочетанное повышение кальцитонина и РЭА после операции требуют приоритетной оценки, поскольку такие признаки могут соответствовать распространённому процессу или активности заболевания. Конкретная тактика определяется врачом после очного анализа данных.',
                  'Некоторые данные требуют более срочного внимания врача. Это не является диагнозом само по себе, но лучше не откладывать консультацию и дообследование.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-THYROID-CANCER'),
                  'Разделы 1.5, 3.7 и 5'
                ),
                (
                  'R-004',
                  'Биохимические признаки послеоперационного гипопаратиреоза',
                  'COMPLICATION',
                  'WARNING',
                  40,
                  TRUE,
                  '{"all":[{"feature":"calcium_post","op":"lt","value":2.15},{"feature":"parathyroid_post","op":"lt","value":15},{"feature":"operation_type","op":"present"}]}'::jsonb,
                  '{"verdict":"POST_OP_HYPOPARATHYROIDISM_CHECK","tags":["complication","calcium"],"recommendations":["Оценить симптомы гипокальциемии и срочность состояния.","Повторить контроль кальция, ПТГ, фосфора, магния и витамина D по назначению врача.","Рассмотреть терапию кальцием и витамином D только после врачебной оценки."]}'::jsonb,
                  'Сочетание сниженного кальция и низкого паратгормона после операции на органах шеи соответствует биохимической картине послеоперационного гипопаратиреоза. Требуется оценить симптомы и подтвердить нарушение фосфорно-кальциевого обмена повторными анализами.',
                  'Кальций и паратгормон снижены после операции. Такое бывает после вмешательств на щитовидной железе и обычно требует контроля врача. При онемении, покалывании вокруг рта или судорогах нужно связаться с врачом срочно.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-HYPOPARATHYROIDISM'),
                  'Термины; раздел 2.3'
                ),
                (
                  'R-005',
                  'Значимое повышение кальцитонина: исключить медуллярный РЩЖ',
                  'DIFFERENTIAL_DIAGNOSIS',
                  'WARNING',
                  50,
                  TRUE,
                  '{"any":[{"feature":"calcitonin_pre","op":"gt","value":100},{"feature":"calcitonin_post","op":"gt","value":100}]}'::jsonb,
                  '{"verdict":"MTC_EXCLUSION_REQUIRED","tags":["calcitonin","medullary_thyroid_cancer"],"recommendations":["Повторить кальцитонин с учётом лабораторных условий и возможных причин ложного повышения.","Оценить РЭА и клинические данные в связке с кальцитонином.","Направить к профильному специалисту для исключения медуллярного рака ЩЖ и определения показаний к генетическому тестированию."]}'::jsonb,
                  'Кальцитонин является ключевым лабораторным маркером медуллярного рака щитовидной железы. Значимое повышение требует подтверждения и профильной оценки, но не должно трактоваться изолированно без клиники, РЭА, визуализации и гистологии.',
                  'Кальцитонин повышен значительно. Это повод для дополнительной проверки у профильного специалиста, чтобы исключить особый тип опухоли щитовидной железы.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-MTC'),
                  'Раздел 2.3'
                ),
                (
                  'R-006',
                  'Маркерные признаки возможного рецидива или прогрессирования',
                  'RECURRENCE_SUSPECT',
                  'CRITICAL',
                  60,
                  TRUE,
                  '{"any":[{"all":[{"feature":"antibody_to_tg_post","op":"gt","value":115},{"feature":"antibody_to_tg_delta","op":"gt","value":30}]},{"all":[{"feature":"calcitonin_post","op":"gt","value":10},{"feature":"calcitonin_delta","op":"gt","value":2}]},{"all":[{"feature":"cea_post","op":"gt","value":5},{"feature":"calcitonin_post","op":"gt","value":10}]}]}'::jsonb,
                  '{"verdict":"MARKER_BASED_RECURRENCE_CHECK","tags":["recurrence","follow_up"],"recommendations":["Сопоставить рост маркеров с клиническими данными и типом опухоли.","Провести УЗИ шеи и зон регионарного лимфооттока по показаниям.","Рассмотреть дополнительную визуализацию или цитологическую верификацию подозрительных очагов по решению врача."]}'::jsonb,
                  'Рост антител к тиреоглобулину в динамике, нарастающий кальцитонин или сочетание кальцитонина с РЭА являются поводом для проверки возможной активности заболевания. Правило формирует сигнал для дообследования, а не подтверждает рецидив.',
                  'Некоторые маркеры изменились в динамике. Это не означает, что рецидив подтверждён, но нужно проверить ситуацию дополнительными обследованиями.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-THYROID-CANCER'),
                  'Разделы 3.7, 5 и 7.2'
                ),
                (
                  'R-007',
                  'ТТГ выше целевого диапазона после тиреоидэктомии',
                  'THERAPY_ADJUSTMENT',
                  'WARNING',
                  70,
                  TRUE,
                  '{"all":[{"feature":"tsh_post","op":"gt","value":2.0},{"feature":"operation_type","op":"in","values":["тиреоидэктомия","Тиреоидэктомия","ТИРЕОИДЭКТОМИЯ"]}]}'::jsonb,
                  '{"verdict":"TSH_ABOVE_TARGET_AFTER_THYROIDECTOMY","tags":["therapy","levothyroxine"],"recommendations":["Оценить регулярность и правильность приёма левотироксина.","Сопоставить ТТГ со свободным Т4, массой тела, сопутствующими заболеваниями и целью терапии.","Рассмотреть врачебную коррекцию заместительной или супрессивной терапии с повторным контролем ТТГ и свободного Т4."]}'::jsonb,
                  'После тиреоидэктомии целевой уровень ТТГ определяется целью терапии и онкологическим контекстом. ТТГ выше 2.0 мЕд/л может указывать на недостаточную заместительную или супрессивную терапию, но решение о дозе принимает врач с учётом свободного Т4 и сопутствующих факторов.',
                  'ТТГ выше ожидаемого уровня после операции. Не меняйте дозу самостоятельно: врач оценит свободный Т4, схему приёма препарата и при необходимости скорректирует лечение.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-THYROID-CANCER'),
                  'Раздел 7.2'
                ),
                (
                  'R-008',
                  'Чрезмерная супрессия ТТГ при сердечно-сосудистой патологии',
                  'THERAPY_ADJUSTMENT',
                  'CRITICAL',
                  80,
                  TRUE,
                  '{"all":[{"feature":"tsh_post","op":"lt","value":0.1},{"feature":"comorbidity_cv","op":"eq","value":1}]}'::jsonb,
                  '{"verdict":"TSH_OVER_SUPPRESSION_WITH_CV_CONTEXT","tags":["therapy","cardiac_safety"],"recommendations":["Оценить необходимость текущей степени супрессии ТТГ.","Учитывать сердечно-сосудистые заболевания при выборе цели ТТГ.","Рассмотреть ЭКГ, консультацию кардиолога и врачебную коррекцию терапии при наличии симптомов или высокого кардиального риска."]}'::jsonb,
                  'Выраженная супрессия ТТГ на фоне сердечно-сосудистой патологии требует осторожности. Цель ТТГ после РЩЖ должна балансировать онкологическую безопасность и риск осложнений, поэтому пациенту нужна индивидуальная врачебная оценка.',
                  'ТТГ сильно снижен, а в данных есть сердечно-сосудистые заболевания. Это повод обсудить с врачом безопасность текущей дозы препарата.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-THYROID-CANCER'),
                  'Раздел 7.2'
                ),
                (
                  'R-009',
                  'Затяжная послеоперационная гипокальциемия: контроль гипопаратиреоза',
                  'COMPLICATION',
                  'WARNING',
                  90,
                  TRUE,
                  '{"all":[{"feature":"calcium_post","op":"lt","value":2.15},{"feature":"parathyroid_post","op":"lt","value":15},{"feature":"hospital_stay_days","op":"gt","value":14}]}'::jsonb,
                  '{"verdict":"PROLONGED_POST_OP_HYPOCALCEMIA","tags":["complication","long_term_follow_up"],"recommendations":["Проверить динамику кальция и ПТГ после выписки.","Оценить необходимость длительного наблюдения по поводу послеоперационного гипопаратиреоза.","Контролировать фосфорно-кальциевый обмен и функцию почек по плану врача."]}'::jsonb,
                  'Сниженный кальций и низкий ПТГ при затяжном послеоперационном течении требуют наблюдения на предмет послеоперационного гипопаратиреоза. Хроническая форма подтверждается только при длительном сохранении нарушений, поэтому правило формирует сигнал для контроля, а не окончательный диагноз.',
                  'Кальций и паратгормон остаются сниженными после операции. Важно продолжить наблюдение и контроль анализов, чтобы врач понял, восстановится ли функция околощитовидных желез.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-HYPOPARATHYROIDISM'),
                  'Термины; разделы 2.3 и 5'
                ),
                (
                  'R-010',
                  'Лабораторные признаки недостаточной заместительной терапии',
                  'THERAPY_ADJUSTMENT',
                  'WARNING',
                  100,
                  TRUE,
                  '{"all":[{"feature":"tsh_post","op":"gt","value":4.0},{"feature":"t4_free_post","op":"lt","value":9}]}'::jsonb,
                  '{"verdict":"INADEQUATE_THYROID_REPLACEMENT_CHECK","tags":["therapy","hypothyroidism"],"recommendations":["Оценить правильность приёма левотироксина: натощак, отдельно от препаратов кальция и железа.","Проверить причины нарушения всасывания или нерегулярного приёма.","Рассмотреть врачебную коррекцию заместительной терапии и повторный контроль ТТГ/свободного Т4."]}'::jsonb,
                  'Повышенный ТТГ при сниженном свободном Т4 соответствует лабораторной картине гипотиреоза или недостаточной заместительной терапии. Коррекция проводится врачом после оценки режима приёма препарата и возможных причин нарушения всасывания.',
                  'Анализы похожи на нехватку гормона щитовидной железы. Часто это связано с дозой или режимом приёма препарата, но менять лечение нужно только вместе с врачом.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-HYPOTHYROIDISM'),
                  'Разделы 2.3 и 3.1.1'
                ),
                (
                  'R-011',
                  'Рост антител к тиреоглобулину в динамике',
                  'FOLLOW_UP',
                  'WARNING',
                  110,
                  TRUE,
                  '{"all":[{"feature":"antibody_to_tg_post","op":"gt","value":115},{"feature":"antibody_to_tg_delta","op":"gt","value":30}]}'::jsonb,
                  '{"verdict":"RISING_TG_ANTIBODIES_FOLLOW_UP","tags":["follow_up","marker_dynamics"],"recommendations":["Повторить антитела к тиреоглобулину и профильные маркеры в динамике.","Сопоставить результат с УЗИ шеи и клинической картиной.","При сохраняющемся росте обсудить дополнительное обследование с профильным специалистом."]}'::jsonb,
                  'Антитела к тиреоглобулину могут мешать интерпретации тиреоглобулина и используются в динамическом наблюдении. Их рост после операции является поводом для повторного контроля и сопоставления с УЗИ шеи и клиническими данными.',
                  'Один из показателей наблюдения вырос. Это повод повторить анализ и обсудить динамику с врачом, но само по себе не подтверждает рецидив.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-THYROID-CANCER'),
                  'Разделы 5 и 7.2'
                ),
                (
                  'R-012',
                  'Bethesda V: цитологическое подозрение на злокачественность',
                  'PREOP_RISK',
                  'INFO',
                  120,
                  TRUE,
                  '{"all":[{"feature":"bethesda","op":"eq","value":5}]}'::jsonb,
                  '{"verdict":"BETHESDA_V_ONCOLOGY_SIGNIFICANT","tags":["preop","cytology"],"recommendations":["Учитывать категорию Bethesda при оценке исходной онкологической настороженности.","Сопоставить цитологию с УЗИ, гистологией и послеоперационным диагнозом.","Использовать признак как контекст для последующего наблюдения, а не как самостоятельный послеоперационный вывод."]}'::jsonb,
                  'Категория Bethesda V означает цитологическое подозрение на злокачественность до операции. В экспертной системе этот факт используется как контекст исходной онкологической настороженности и должен сопоставляться с гистологией.',
                  'До операции цитология была подозрительной, поэтому случай требует внимательного сопоставления с результатами гистологии и дальнейшим наблюдением.',
                  (SELECT id FROM clinical_sources WHERE code='KR-RF-THYROID-CANCER'),
                  'Раздел 2.5'
                )
              ON CONFLICT (code) DO UPDATE SET
                title = EXCLUDED.title,
                category = EXCLUDED.category,
                severity = EXCLUDED.severity,
                priority = EXCLUDED.priority,
                is_active = EXCLUDED.is_active,
                condition_json = EXCLUDED.condition_json,
                action_json = EXCLUDED.action_json,
                rationale = EXCLUDED.rationale,
                patient_message = EXCLUDED.patient_message,
                source_id = EXCLUDED.source_id,
                source_section = EXCLUDED.source_section,
                updated_at = now();
