databaseChangeLog:
  - changeSet:
      id: 008-performance-indexes
      author: medical-app
      changes:
        - createIndex:
            indexName: idx_analysis_reports_user
            tableName: analysis_reports
            columns:
              - column: { name: user_id }
        - createIndex:
            indexName: idx_report_patients_patient
            tableName: report_patients
            columns:
              - column: { name: patient_id }
        - createIndex:
            indexName: idx_patients_attending_doctor
            tableName: patients
            columns:
              - column: { name: attending_doctor_user_id }
        - createIndex:
            indexName: idx_users_patient
            tableName: users
            columns:
              - column: { name: patient_id }
