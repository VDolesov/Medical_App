name: medical_app_v2
description: "Медицинское приложение — переработанный UI/UX (Material 3)."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  http: ^1.2.0

  provider: ^6.1.2

  go_router: ^14.2.0

  flutter_secure_storage: ^9.2.2

  file_picker: ^8.0.0

  google_fonts: ^6.2.1

  intl: ^0.19.0

  # PDF: скачиваем во временную директорию и открываем сторонним просмотрщиком.
  path_provider: ^2.1.4
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
