# Render Blueprint: Java-бэкенд (Docker). База — внешняя (Neon), строка подключения
# запрашивается при применении Blueprint (sync: false).
# Render Dashboard → New → Blueprint → выбрать этот репозиторий → вставить DATABASE_URL → Apply.
# Подробности и порядок переезда с Node-версии — в DEPLOY.md.
services:
  - type: web
    name: reportmed-api-v3
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # postgres://user:pass@host/db?sslmode=require — приложение само раскладывает её в spring.datasource.*.
      # Бесплатная Postgres самого Render удаляется через 30 дней, поэтому база внешняя (Neon).
      - key: DATABASE_URL
        sync: false
      # Render генерирует случайные значения; ADMIN_SECRET потом смотреть в Dashboard → Environment.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://reportmed.ru,https://www.reportmed.ru
      # Free-инстанс даёт 512 МБ: ограничиваем кучу и пулы, чтобы JVM не убили по памяти.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -Dfile.encoding=UTF-8
      - key: DB_POOL_MAX
        value: "4"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: TOMCAT_THREADS_MAX
        value: "20"
