# Render Blueprint: Java-бэкенд (Docker) + PostgreSQL.
# Render Dashboard → New → Blueprint → выбрать этот репозиторий → Apply.
# Подробности и порядок переезда с Node-версии — в DEPLOY.md.
services:
  - type: web
    name: reportmed-api-v3
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Одна строка postgres://… — приложение само раскладывает её в spring.datasource.*.
      # Чтобы использовать внешнюю базу (Neon и т.п.), просто замените значение в Dashboard.
      - key: DATABASE_URL
        fromDatabase:
          name: reportmed-db
          property: connectionString
      # Render генерирует случайные значения; ADMIN_SECRET потом смотреть в Dashboard → Environment.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://reportmed.ru,https://www.reportmed.ru
      # Free-инстанс даёт 512 МБ: ограничиваем кучу и пулы, чтобы JVM не убили по памяти.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -Dfile.encoding=UTF-8
      - key: DB_POOL_MAX
        value: "4"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: TOMCAT_THREADS_MAX
        value: "20"

databases:
  - name: reportmed-db
    plan: free
    region: frankfurt
    databaseName: medical
    user: medical
